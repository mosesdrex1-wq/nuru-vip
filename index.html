<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESTRICTED</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial}
body{background:#000;height:100vh;display:flex;justify-content:center;align-items:center}
.box{width:96%;max-width:410px;height:94vh;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;border:2px solid #ff003c;box-shadow:0 0 50px rgba(255,0,60,0.4);background:black}
.header-lock{background:black;padding:14px;text-align:center;border-bottom:1px solid #ff0000;color:#ff0000;letter-spacing:4px;font-weight:900;font-size:13px}
#login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:22px;background:radial-gradient(ellipse at center,#1a0000,#000)}
.skull{font-size:80px;filter:drop-shadow(0 0 25px red);animation:shake 0.2s infinite}
@keyframes shake{0%{transform:translate(1px,1px)}50%{transform:translate(-1px,-1px)}}
.locked{color:#ff0000;font-size:34px;letter-spacing:5px;font-weight:900;text-shadow:0 0 20px red;margin-top:8px}
#login input{width:100%;padding:14px;margin-top:12px;border-radius:12px;border:1.5px solid #ff0000;background:#120000;color:white;outline:none}
#login button{width:100%;margin-top:15px;padding:14px;background:linear-gradient(90deg,#8b0000,#ff003c);color:white;border:none;border-radius:12px;font-weight:900;box-shadow:0 0 25px red}
.hell-warn{margin-top:16px;background:rgba(255,0,0,0.08);border:1.5px solid red;border-radius:10px;padding:10px;width:100%;color:#ff4444;font-size:10px;font-weight:900;text-align:center}

/* INSIDE CHAT - FIXED */
#chat{display:none;flex-direction:column;flex:1;background:#050505;position:relative}
#chat::before{content:'';position:absolute;width:400px;height:400px;background:rgba(255,0,80,0.15);filter:blur(90px);border-radius:50%;top:30%;left:10%;pointer-events:none}
#chatHeader{background:rgba(0,0,0,0.9);padding:14px;text-align:center;border-bottom:1px solid rgba(255,0,60,0.25);backdrop-filter:blur(15px);z-index:3}
#chatHeader.vip{color:#ffd700;font-size:15px;letter-spacing:3px;font-weight:900;text-shadow:0 0 12px rgba(255,215,0,0.6)}
#chatHeader.rom{font-family:'Great Vibes',cursive;color:#ff7aa2;font-size:21px;margin-top:5px;text-shadow:0 0 15px rgba(255,100,150,0.7)}
#msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:11px;z-index:2}
.msg{max-width:80%;padding:11px 14px;border-radius:18px;font-size:14.5px;z-index:2;position:relative}
.me{align-self:flex-end;background:linear-gradient(135deg,#ff003c 0%,#ff6b8a 100%);color:white;border-bottom-right-radius:5px;box-shadow:0 3px 15px rgba(255,0,60,0.3)}
.other{align-self:flex-start;background:rgba(35,20,30,0.95);color:#ffb3c6;border:1px solid rgba(255,100,150,0.2);border-bottom-left-radius:5px}
.name{font-size:9px;opacity:0.7;margin-bottom:2px;color:#ff8ab4}
.msg img{max-width:100%;border-radius:12px;margin-top:6px;border:1px solid rgba(255,100,150,0.2)}
.msg audio{width:210px;margin-top:6px;filter:hue-rotate(320deg)}
.input-area{display:flex;padding:10px;background:rgba(15,0,10,0.95);border-top:1px solid rgba(255,0,60,0.25);gap:7px;align-items:center;z-index:3}
.input-area input[type=text]{flex:1;padding:12px 16px;border-radius:25px;border:1px solid rgba(255,100,150,0.25);background:rgba(30,10,20,0.9);color:white;outline:none}
.icon-btn{background:rgba(40,0,20,0.9);border:1px solid rgba(255,0,60,0.3);width:42px;height:42px;border-radius:50%;color:#ff6b9d;display:flex;align-items:center;justify-content:center}
.send-btn{background:linear-gradient(135deg,#ff003c,#ff7aa2);border:none;width:46px;height:46px;border-radius:50%;color:white;font-size:18px;box-shadow:0 0 12px rgba(255,0,60,0.4)}
.voice-recording{background:red!important;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7)}70%{box-shadow:0 0 0 10px rgba(255,0,0,0)}}
#denied{position:fixed;top:0;left:0;width:100%;height:100%;background:black;display:none;justify-content:center;align-items:center;z-index:9999;flex-direction:column;gap:15px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="box">
<div class="header-lock" id="lockHead">☠️ RESTRICTED ZONE ☠️</div>

<div id="login">
<div class="skull">💀</div>
<div class="locked">LOCKED</div>
<input id="uname" placeholder="Name">
<input id="ukey" type="password" placeholder="Key">
<button onclick="join()">UNLOCK ☠️</button>
<div class="hell-warn">☠️ CURSED ZONE — FALL INTO A PIT WITH NO RETURN. LEAVE NOW 💀</div>
</div>

<div id="chat">
<div id="chatHeader">
<div class="vip">NURU VIP ❤️ PRIVATE</div>
<div class="rom" id="romLine">Drex was born to love Nuru — nothing else 💛🔐</div>
</div>
<div id="msgs"></div>
<div class="input-area">
<label class="icon-btn">📷<input id="imgInput" type="file" accept="image/*" hidden onchange="sendImage(this)"></label>
<button class="icon-btn" id="voiceBtn" onclick="toggleVoice()">🎙️</button>
<input id="msgInput" type="text" placeholder="Message..." onkeypress="if(event.key==='Enter')send()">
<button class="send-btn" onclick="send()">❤️</button>
</div>
</div>
</div>

<div id="denied">
<h1 style="color:red;font-size:60px">💀</h1>
<h1 style="color:red">ACCESS DENIED</h1>
<p style="color:#ff4444;font-weight:900">NOT DREX OR NURU — CURSE ACTIVATED ☠️</p>
<button onclick="document.getElementById('denied').style.display='none'" style="margin-top:15px;padding:12px 25px;border-radius:20px;border:2px solid red;background:black;color:red;font-weight:900">RUN</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCz5pO6O-ytj3PaNYAC36TCZA8QHjCq7lY", authDomain: "nuru-love.firebaseapp.com", projectId: "nuru-love", storageBucket: "nuru-love.firebasestorage.app", messagingSenderId: "190648413438", appId: "1:190648413438:web:8072bfb8954a1a3f5b09af" };
const romLines=["Drex was born to love Nuru — nothing else 💛🔐","My heartbeat spells N-U-R-U 💓","Nuru, my queen, my forever 👑❤️","You are my only prayer, Nuru ✨"];
let r=0;setInterval(()=>{const e=document.getElementById('romLine');e.style.opacity=0;setTimeout(()=>{e.innerText=romLines[r];e.style.opacity=1;r=(r+1)%romLines.length},300)},5000);
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const col=collection(db,"nuru_chat");
let myName="",mediaRecorder,audioChunks=[],isRecording=false;
window.join=()=>{
  const n=document.getElementById('uname').value.trim();
  const k=document.getElementById('ukey').value.trim();
  if((n!=='Drex' && n!=='Nuru') || k!=='LOVE'){document.getElementById('denied').style.display='flex';return}
  myName=n;document.getElementById('login').style.display='none';document.getElementById('lockHead').style.display='none';document.getElementById('chat').style.display='flex';loadMsgs();
}
function loadMsgs(){
  const q=query(col,orderBy("time"));
  onSnapshot(q,(snap)=>{
    const div=document.getElementById('msgs');div.innerHTML='';
    snap.forEach(d=>{const m=d.data();const isMe=m.name===myName;let c=m.text||"";if(m.image){c+=`<img src="${m.image}" onclick="window.open(this.src)">`}if(m.voice){c+=`<audio controls src="${m.voice}"></audio>`}div.innerHTML+=`<div class="msg ${isMe?'me':'other'}"><div class="name">${m.name}</div>${c}</div>`;});
    div.scrollTop=div.scrollHeight;
  });
}
window.send=async()=>{const i=document.getElementById('msgInput');const t=i.value.trim();if(!t) return;await addDoc(col,{name:myName,text:t,time:serverTimestamp()});i.value='';}
window.sendImage=(input)=>{const f=input.files[0];if(!f) return;if(f.size>800*1024){alert('Use <800KB');return}const r=new FileReader();r.onload=e=>{addDoc(col,{name:myName,text:"",image:e.target.result,time:serverTimestamp()});};r.readAsDataURL(f);input.value='';}
window.toggleVoice=async()=>{
  const b=document.getElementById('voiceBtn');
  if(!isRecording){
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(s);audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=async()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        if(blob.size>900*1024){alert('Keep <20sec');return}
        const reader=new FileReader();reader.onload=e=>{addDoc(col,{name:myName,text:"",voice:e.target.result,time:serverTimestamp()});};reader.readAsDataURL(blob);
        s.getTracks().forEach(t=>t.stop());
      };
      mediaRecorder.start();isRecording=true;b.classList.add('voice-recording');b.innerText='⏹️';
    }catch(e){alert('Allow mic!');}
  }else{mediaRecorder.stop();isRecording=false;b.classList.remove('voice-recording');b.innerText='🎙️';}
}
</script>
</body>
</html>
