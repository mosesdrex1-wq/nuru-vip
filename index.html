<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuru VIP ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:radial-gradient(circle at top,#2a0a4a,#080810);height:100vh;display:flex;justify-content:center;align-items:center}
.box{background:#12121a;width:96%;max-width:410px;height:92vh;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 50px rgba(255,77,109,0.35);border:1px solid rgba(255,215,0,0.25)}
.header{background:linear-gradient(90deg,#ff4d6d,#8a2be2);color:white;padding:14px;text-align:center;font-weight:bold}
#login{padding:22px;display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center;background:radial-gradient(circle at center,#1e1e32,#0f0f14)}
.romantic{background:rgba(138,43,226,0.15);border:1px solid rgba(138,43,226,0.3);border-radius:15px;padding:15px;text-align:center;min-height:70px;display:flex;align-items:center;justify-content:center}
.romantic p{color:#ffb3d9;font-size:14px;font-style:italic;transition:0.5s}
#login input{padding:15px;border-radius:12px;border:1px solid #333;background:#1f1f2f;color:white;font-size:16px;outline:none}
#login button{padding:15px;background:linear-gradient(90deg,#ff4d6d,#ff8a00);color:white;border:none;border-radius:12px;font-size:17px;font-weight:bold}
.caution{background:rgba(255,77,109,0.12);border:1px solid rgba(255,77,109,0.3);border-radius:12px;padding:12px;text-align:center;color:#ff9ab0;font-size:11px;line-height:1.4}
#chat{display:none;flex-direction:column;flex:1;background:#0f0f14}
#loveHeader{background:linear-gradient(90deg,#ff4d6d,#8a2be2);padding:10px;text-align:center;color:white;font-size:12px;letter-spacing:0.5px;animation:glow 2s infinite alternate}
@keyframes glow{from{box-shadow:0 0 5px #ff4d6d}to{box-shadow:0 0 15px #8a2be2}}
#msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;background:#0f0f14}
.msg{max-width:80%;padding:11px 14px;border-radius:18px;font-size:15px;word-wrap:break-word;position:relative}
.me{align-self:flex-end;background:linear-gradient(135deg,#8a2be2,#ff4d6d);color:white;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#232333;color:white;border-bottom-left-radius:4px;border:1px solid #333}
.name{font-size:10px;opacity:0.6;margin-bottom:3px;color:#ffb3c6}
.msg img{max-width:100%;border-radius:12px;margin-top:6px;display:block}
.input-area{display:flex;padding:10px;background:#1a1a2e;border-top:1px solid #333;gap:8px;align-items:center}
.input-area input[type=text]{flex:1;padding:13px;border-radius:25px;border:1px solid #333;background:#232333;color:white;outline:none}
.icon-btn{background:#232333;border:1px solid #444;width:44px;height:44px;border-radius:50%;color:white;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.send-btn{background:linear-gradient(135deg,#ff4d6d,#8a2be2);color:white;border:none;width:48px;height:48px;border-radius:50%;font-size:20px}
</style>
</head>
<body>
<div class="box">
<div class="header">NURU VIP ❤️ PRIVATE</div>

<div id="login">
<h2>💜 Locked 💖</h2>
<div class="romantic"><p id="romText">You are my favorite notification ❤️</p></div>
<input id="uname" placeholder="Name: Drex or Nuru">
<input id="ukey" type="password" placeholder="Enter Secret Key 🔑">
<button onclick="join()">Unlock Our World 🔓</button>
<div class="caution">⚠️ CAUTION: Private love space<br>Only <b>Drex</b> & <b>Nuru</b> allowed. Our secret ❤️</div>
<p style="text-align:center;font-size:11px;color:#555">Drex ❤️ Nuru Forever</p>
</div>

<div id="chat">
<div id="loveHeader">❤️ <span id="headerLove">My Queen Nuru, you own my heart 💜</span> ❤️</div>
<div id="msgs"></div>
<div class="input-area">
<label class="icon-btn">📷<input id="imgInput" type="file" accept="image/*" hidden onchange="sendImage(this)"></label>
<input id="msgInput" type="text" placeholder="Type Hi Nuru ❤️" onkeypress="if(event.key==='Enter')send()">
<button class="send-btn" onclick="send()">❤️</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCz5pO6O-ytj3PaNYAC36TCZA8QHjCq7lY",
  authDomain: "nuru-love.firebaseapp.com",
  projectId: "nuru-love",
  storageBucket: "nuru-love.firebasestorage.app",
  messagingSenderId: "190648413438",
  appId: "1:190648413438:web:8072bfb8954a1a3f5b09af"
};

const romanticWords = ["You are my favorite notification ❤️","In a world of many, you are my only 💜","I still get butterflies when I see your name 💖","You + Me = Forever 🔐","My heart beats your name, Nuru 💓","No one else matters, just us ❤️","Every message from you is my happy place ✨","I fell for you and I'm still falling 💜"];
const headerLoves = ["My Queen Nuru, you own my heart 💜","Drex ❤️ Nuru - Forever Together","You are my home, Nuru 🏠❤️","Every pic you send makes my day ✨","Can't wait to see your beautiful face 😍","My love, my everything 💖","Only us, no one else 🔐❤️"];

let idx=0, hIdx=0;
function changeRom(){
  const el=document.getElementById('romText');
  el.style.opacity=0;
  setTimeout(()=>{el.innerText=romanticWords[idx];el.style.opacity=1;idx=(idx+1)%romanticWords.length},300);
}
function changeHeader(){
  document.getElementById('headerLove').innerText=headerLoves[hIdx];
  hIdx=(hIdx+1)%headerLoves.length;
}
changeRom(); changeHeader();
setInterval(changeRom,4000);
setInterval(changeHeader,5000);

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const col=collection(db,"nuru_chat");
let myName="";

window.join=()=>{
  const n=document.getElementById('uname').value.trim();
  const k=document.getElementById('ukey').value.trim();
  if(n!=='Drex' && n!=='Nuru'){alert('Name must be Drex or Nuru');return}
  if(k!=='LOVE'){alert('Wrong Key!');return}
  myName=n;
  document.getElementById('login').style.display='none';
  document.getElementById('chat').style.display='flex';
  loadMsgs();
}
function loadMsgs(){
  const q=query(col,orderBy("time"));
  onSnapshot(q,(snap)=>{
    const div=document.getElementById('msgs');
    div.innerHTML='';
    snap.forEach(d=>{
      const m=d.data();
      const isMe=m.name===myName;
      let content=m.text||"";
      if(m.image){content+=`<img src="${m.image}" onclick="window.open(this.src)">`}
      div.innerHTML+=`<div class="msg ${isMe?'me':'other'}"><div class="name">${m.name}</div>${content}</div>`;
    });
    div.scrollTop=div.scrollHeight;
  });
}
window.send=async()=>{
  const inp=document.getElementById('msgInput');
  const t=inp.value.trim();
  if(!t) return;
  await addDoc(col,{name:myName,text:t,time:serverTimestamp()});
  inp.value='';
}
window.sendImage=(input)=>{
  const file=input.files[0];
  if(!file) return;
  if(file.size>800*1024){alert('Pic too big! Use under 800KB bro');return}
  const reader=new FileReader();
  reader.onload=e=>{
    addDoc(col,{name:myName,text:"",image:e.target.result,time:serverTimestamp()});
  };
  reader.readAsDataURL(file);
  input.value='';
}
</script>
</body>
</html>
