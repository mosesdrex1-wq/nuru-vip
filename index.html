<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Nuru Abdulart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;background:#0a0a0f;overflow-x:hidden}body{color:#fff;font-family:Poppins,sans-serif;height:100vh;overflow:hidden}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:1}.login{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a0a14 0%,#000 70%);padding:16px}
.card{width:100%;max-width:380px;background:linear-gradient(180deg,#1c1215,#0f0a0c);border:1.5px solid #ff0a3c;border-radius:26px;padding:24px 22px;text-align:center}
.card h1{font-family:Great Vibes,cursive;font-size:42px;background:linear-gradient(90deg,#fff,#ff8fab,#ff0a3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0}
.card input{width:100%;padding:13px;margin:8px 0;border-radius:999px;border:1px solid #3a1a22;background:#1a1214;color:#fff;text-align:center;outline:none}.card button{width:100%;padding:13px;margin-top:12px;border-radius:999px;border:0;background:linear-gradient(90deg,#ff0a3c,#ff5a8a);color:#fff;font-weight:700}
.caution{margin-top:14px;padding:12px 14px;background:#000;border:1px solid #3a0a15;color:#ff8fab;font-size:10px;line-height:1.45;border-radius:12px;text-align:left;white-space:normal;word-wrap:break-word}
.app{display:none;flex-direction:column;height:100vh;width:100%;position:relative;z-index:2;overflow:hidden}.top{background:#000;border-bottom:2px solid #ff0a3c;padding:12px 10px;text-align:center;width:100%}.top-title{font-family:Great Vibes,cursive;font-size:22px;background:linear-gradient(90deg,#fff,#ff8fab,#ff0a3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}.top-sub{font-size:9px;letter-spacing:2px;color:#ff8fab;margin-top:3px}.top-love{margin-top:8px;font-size:12px;color:#fff;background:linear-gradient(90deg,#1a0a0f,#2a1218);border:1px solid #3a1a22;padding:7px 14px;border-radius:999px;display:inline-block}
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 28px 140px 12px!important;display:flex;flex-direction:column;gap:9px;background:radial-gradient(ellipse at top,#1a0a12 0%,#0a0a0f 70%);width:100%!important}.b{max-width:60%!important;padding:8px 11px!important;border-radius:15px!important;font-size:12.5px!important;line-height:1.3;word-break:break-word;position:relative;cursor:pointer;user-select:none}.me{align-self:flex-end;background:linear-gradient(135deg,#ff0a3c,#ff5a8a);color:#fff;border-bottom-right-radius:4px;margin-right:14px!important}.her{align-self:flex-start;background:#fff;color:#1a0a0f;border-bottom-left-radius:4px}.b small{font-size:8px;opacity:.7;display:block;margin-top:3px}
.bar{position:fixed;bottom:56px;left:0;right:0;display:flex;gap:8px;padding:10px 14px;background:#000;border-top:1.5px solid #ff0a3c;z-index:4}.bar input{flex:1;min-width:0;padding:11px 16px;border-radius:999px;border:1px solid #3a1a22;background:#1a1214;color:#fff;outline:none;font-size:13px}.btn{width:42px;height:42px;border-radius:50%;border:0;flex-shrink:0}.send{background:linear-gradient(135deg,#ff0a3c,#ff5a8a);color:#fff}.music-bar{position:fixed;bottom:0;left:0;right:0;height:56px;background:#000;border-top:1px solid #2a1218;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:4}.music-bar audio{flex:1;height:32px;filter:invert(1);min-width:0}
#blast{position:fixed;inset:0;z-index:100;display:none;pointer-events:none}.particle{position:absolute;left:50%;top:50%}.shake{animation:shake.6s ease}@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}}
#msgMenu{position:fixed;inset:0;z-index:999;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}#msgMenu.show{display:flex!important}.menuBox{width:100%;max-width:400px;background:#1a1214;border-top:1.5px solid #ff0a3c;border-radius:22px 22px 0 0;padding:14px 14px 20px}.menuBox button{width:100%;padding:15px;background:#0f0a0c;border:1px solid #3a1a22;color:#fff;border-radius:12px;margin:6px 0;font-size:14px;text-align:left}.menuBox button.del{color:#ff4a6a;border-color:#ff0a3c}.menuBox button.cancelBtn{justify-content:center;background:#000;color:#ff8fab;margin-top:10px;text-align:center}
</style></head><body>
<canvas id="hearts"></canvas><div id="blast"></div>
<div id="msgMenu"><div class="menuBox">
<div style="width:40px;height:4px;background:#3a1a22;border-radius:99px;margin:0 auto 12px"></div>
<div style="color:#ff8fab;font-size:11px;text-align:center;margin-bottom:10px">Message Options</div>
<button onclick="doEdit()">✏️ Edit for Everyone</button>
<button class="del" onclick="doDelete()">🗑️ Delete for Everyone</button>
<button class="cancelBtn" onclick="closeMenu()">Cancel</button>
</div></div>
<div class="login" id="login"><div class="card">
<h1>For Nuru Abdulart ❤️</h1>
<p style="font-size:10px;color:#ff8fab;letter-spacing:1px;margin:8px 0 16px">PRIVATE VAULT • AUTHORIZED ONLY</p>
<input id="n" placeholder="Drex or Nuru"><input id="k" type="password" placeholder="Secret Key">
<button onclick="go()">Unlock Our World 🔐</button>
<div class="caution">⚠️ CAUTION: Specialized for NURU ABDULART ONLY.</div>
</div></div>
<div class="app" id="app">
<div class="top"><div class="top-title">My Home Is Where You Are, My Nuru ❤️</div><div class="top-sub">MY FOREVER IN ONE PERSON</div><div class="top-love">You and Me Against the world 🌍❤️</div><div id="status" style="font-size:9px;color:#5a5a5a;margin-top:4px">Connecting...</div></div>
<div class="chat" id="chat"></div>
<div class="bar"><label class="btn" style="background:#1a0a0f;border:1px solid #ff0a3c;display:flex;align-items:center;justify-content:center">📷<input type="file" id="pic" accept="image/*" hidden></label><input id="msg" placeholder="Type something sweet..."><button class="btn send" onclick="send()">➤</button></div>
<div class="music-bar"><span style="color:#ff0a3c">❤️</span><audio id="song" controls autoplay loop><source src="promise.mp3" type="audio/mpeg"></audio><span style="font-size:11px;color:#ff8fab">Promise</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCz5pO6O-ytj3PaNYAC36TCZA8QHjCq7lY",
  authDomain: "nuru-love.firebaseapp.com",
  projectId: "nuru-love",
  storageBucket: "nuru-love.firebasestorage.app",
  messagingSenderId: "190648413438",
  appId: "1:190648413438:web:8072bfb8954a1a3f5b09af"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const col = collection(db, "nuru_chat");

let me='';let selectedId=null;const chat=document.getElementById('chat');
let c=document.getElementById('hearts');let x=c.getContext('2d');function R(){c.width=innerWidth;c.height=innerHeight}R();onresize=R;let h=[];setInterval(()=>{h.push({X:Math.random()*c.width,Y:c.height+20,S:13+Math.random()*12,V:0.9+Math.random()*1.2,ico:Math.random()>0.6?'❤️':Math.random()>0.5?'💖':'💗'})},180);
(function A(){x.clearRect(0,0,c.width,c.height);h.forEach((o,i)=>{o.Y-=o.V;x.font=o.S+'px serif';x.fillText(o.ico,o.X,o.Y);if(o.Y<-30)h.splice(i,1)});requestAnimationFrame(A)})();

window.go = function(){
 let n=document.getElementById('n').value.toLowerCase();let k=document.getElementById('k').value;
 if((n!=='drex'&&n!=='nuru')||k!=='nuru123'){alert('🚫 ACCESS DENIED');return}
 me=n==='drex'?'Drex':'Nuru';
 document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';
 document.getElementById('song').volume=0.9;document.getElementById('song').play().catch(()=>{});
 listen();
}

function listen(){
 const q = query(col, orderBy("time","asc"));
 onSnapshot(q, (snap)=>{
   chat.innerHTML='';
   snap.forEach(d=>{
     const o=d.data(); o.docId=d.id;
     renderMsg(o);
   });
   chat.scrollTop=chat.scrollHeight;
   document.getElementById('status').textContent='● Live • Connected';
 });
}

function renderMsg(o){
 let d=document.createElement('div');d.className='b '+(o.w===me?'me':'her');
 if(o.t)d.innerHTML+=`<div>${o.t}</div>`;
 if(o.i)d.innerHTML+=`<img src="${o.i}" style="max-width:100%;border-radius:12px;margin-top:6px;display:block">`;
 d.innerHTML+=`<small>${o.m||''} • ${o.w}${o.edited?' • edited':''}</small>`;
 d.addEventListener('click',()=>openMenu(o.docId,o.w,o.t));
 chat.appendChild(d);
 if(o.t){let low=o.t.toLowerCase();if(low.includes('i love you')||low.includes('love you')||low.includes('luv u'))massiveBlast();}
}

window.openMenu=function(id,owner,text){
 if(owner!==me)return;
 selectedId=id;
 window._editText=text||'';
 document.getElementById('msgMenu').classList.add('show');
 if(navigator.vibrate)navigator.vibrate(50);
}
window.closeMenu=function(){document.getElementById('msgMenu').classList.remove('show');selectedId=null}
document.getElementById('msgMenu').addEventListener('click',e=>{if(e.target.id==='msgMenu')closeMenu()});

window.doDelete=async function(){
 if(!selectedId)return;
 await deleteDoc(doc(db,"nuru_chat",selectedId));
 closeMenu();
}
window.doEdit=async function(){
 if(!selectedId)return;
 let nt=prompt('Edit message for everyone:',window._editText||'');
 if(nt===null){closeMenu();return}
 if(nt.trim()===''){doDelete();return}
 await updateDoc(doc(db,"nuru_chat",selectedId),{t:nt.trim(),edited:true});
 closeMenu();
}

window.send=async function(){
 let inp=document.getElementById('msg');let t=inp.value.trim();if(!t)return;
 let tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 await addDoc(col,{t,w:me,i:null,m:tm,time:serverTimestamp(),edited:false});
 inp.value='';
}

document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.getElementById('pic').addEventListener('change',e=>{
 let f=e.target.files[0];if(!f)return;
 let r=new FileReader();r.onload=async ev=>{
  let tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  await addDoc(col,{t:'',w:me,i:ev.target.result,m:tm,time:serverTimestamp(),edited:false});
 };r.readAsDataURL(f)
});

function massiveBlast(){
 let b=document.getElementById('blast');b.innerHTML='';b.style.display='block';
 document.getElementById('app').classList.add('shake');
 for(let i=0;i<45;i++){let p=document.createElement('div');p.className='particle';p.innerText=['❤️','💖','💗','💓','💞','💘'][Math.floor(Math.random()*6)];p.style.fontSize=(20+Math.random()*28)+'px';let angle=Math.random()*Math.PI*2;let dist=100+Math.random()*300;let tx=Math.cos(angle)*dist;let ty=Math.sin(angle)*dist;p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.4)`,opacity:1,offset:0.7},{transform:`translate(calc(-50% + ${tx}px), calc(-50% + ${ty*1.3}px)) scale(0)`,opacity:0}],{duration:1000+Math.random()*700,easing:'cubic-bezier(.17,.67,.32,1.2)'});b.appendChild(p);setTimeout(()=>p.remove(),1300);}setTimeout(()=>{b.style.display='none';document.getElementById('app').classList.remove('shake')},1300);
}
</script>
</body></html>
