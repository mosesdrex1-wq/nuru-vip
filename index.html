<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESTRICTED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial}
body{background:#000;height:100vh;display:flex;justify-content:center;align-items:center}
.box{width:96%;max-width:410px;height:94vh;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;border:2px solid #ff0000;box-shadow:0 0 50px rgba(255,0,0,0.5);background:black}
.header{background:black;padding:12px;text-align:center;border-bottom:1px solid #ff0000}
.header-restricted{color:#ff0000;font-size:14px;letter-spacing:4px;font-weight:900;text-shadow:0 0 10px red}
#login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;background:radial-gradient(ellipse at center,#1a0000,#000);text-align:center;position:relative}
.skull{font-size:85px;filter:drop-shadow(0 0 30px red);animation:shake 0.25s infinite}
@keyframes shake{0%{transform:translate(1px,1px)}25%{transform:translate(-1px,-1px)}50%{transform:translate(-1px,1px)}100%{transform:translate(1px,-1px)}}
.locked{color:#ff0000;font-size:34px;font-weight:900;letter-spacing:5px;text-shadow:0 0 20px red;margin-top:10px}
#login input{width:100%;padding:14px;margin-top:12px;border-radius:10px;border:1.5px solid #ff0000;background:#0f0000;color:white;outline:none}
#login button{width:100%;margin-top:15px;padding:14px;background:linear-gradient(90deg,#8b0000,#ff0000);color:white;border:none;border-radius:10px;font-weight:900;letter-spacing:2px;box-shadow:0 0 25px red}
.hell-warn{margin-top:16px;background:rgba(255,0,0,0.1);border:1.5px solid red;border-radius:10px;padding:11px;width:100%;color:#ff3333;font-size:11px;font-weight:900;line-height:1.4}
#chat{display:none;flex-direction:column;flex:1;background:#050505;position:relative}
#chat::before{content:'';position:absolute;width:300px;height:300px;background:rgba(255,0,60,0.18);filter:blur(80px);border-radius:50%;top:20%;left:20%;pointer-events:none}
#chatHeader{background:linear-gradient(90deg,#0a0a0a,#1a0010);padding:12px;text-align:center;border-bottom:1px solid rgba(255,0,60,0.3)}
#chatHeader.title{color:#ffd700;font-size:14px;letter-spacing:3px;font-weight:900}
#chatHeader.rom{font-family:'Great Vibes',cursive;color:#ff6b9d;font-size:19px;margin-top:4px}
#msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:11px;z-index:2}
.msg{max-width:78%;padding:11px 14px;border-radius:18px;font-size:14.5px;z-index:2}
.me{align-self:flex-end;background:linear-gradient(135deg,#ff003c,#ff7aa2);color:white;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:rgba(25,25,25,0.9);color:#ffb3c6;border:1px solid rgba(255,0,60,0.2);border-bottom-left-radius:4px}
.name{font-size:9px;opacity:0.6;margin-bottom:3px;color:#ff7aa2}
.msg img{max-width:100%;border-radius:12px;margin-top:6px}
.msg audio{width:200px;margin-top:6px}
.input-area{display:flex;padding:10px;background:rgba(10,0,5,0.95);border-top:1px solid rgba(255,0,60,0.3);gap:6px;align-items:center}
.input-area input[type=text]{flex:1;padding:12px 16px;border-radius:25px;border:1px solid rgba(255,0,60,0.25);background:rgba(30,10,20,0.8);color:white;outline:none}
.icon-btn{background:rgba(40,0,10,0.8);border:1px solid rgba(255,0,60,0.3);width:42px;height:42px;border-radius:50%;color:#ff4d6d;display:flex;align-items:center;justify-content:center}
.send-btn{background:linear-gradient(135deg,#ff003c,#ff7aa2);border:none;width:46px;height:46px;border-radius:50%;color:white}
.voice-recording{background:red!important;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7)}70%{box-shadow:0 0 0 10px rgba(255,0,0,0)}}
#denied{position:fixed;top:0;left:0;width:100%;height:100%;background:black;display:none;justify-content:center;align-items:center;z-index:9999;flex-direction:column;gap:15px;text-align:center;padding:20px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@900&display=swap" rel="stylesheet">
</head>
<body>
<div class="box">
<div class="header" id="mainHeader"><div class="header-restricted">☠️ RESTRICTED ZONE ☠️</div></div>

<div id="login">
<div class="skull">💀</div>
<div class="locked">LOCKED</div>
<input id="uname" placeholder="Name">
<input id="ukey" type="password" placeholder="Key">
<button onclick="join()">UNLOCK ☠️</button>
<div class="hell-warn">☠️ PRIVATE CURSED ZONE<br>TRESPASSERS FALL INTO A PIT WITH NO RETURN<br>LEAVE NOW — YOU ARE NOT WELCOME 💀</div>
</div>

<div id="chat">
<div id="chatHeader">
<div class="title">NURU VIP ❤️ PRIVATE</div>
<div class="rom">Drex was born to love Nuru — nothing else 💛🔐</div>
</div>
<div id="msgs"></div>
<div class="input-area">
<label class="icon-btn">📷<input id="imgInput" type="file" accept="image/*" hidden onchange="sendImage(this)"></label>
<button class="icon-btn" id="voiceBtn" onclick="toggleVoice()">🎙️</button>
<input id="msgInput" type="text" placeholder="Message..." onkeypress="if(event.key==='Enter')send()">
<button class="send-btn" onclick="send()">❤️</button>
</div>
</div>
</div>

<div id="denied">
<h1 style="color:red;font-size:60px">💀</h1>
<h1 style="color:red;letter-spacing:3px">ACCESS DENIED</h1>
<p style="color:#ff3333;font-weight:900;margin-top:10px">YOU DO NOT BELONG HERE<br>IP LOGGED. CURSE ACTIVATED.<br>RUN ☠️</p>
<button onclick="document.getElementById('denied').style.display='none'" style="margin-top:15px;padding:12px 25px;border-radius:20px;border:2px solid red;background:black;color:red;font-weight:900">RUN</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCz5pO6O-ytj3PaNYAC36TCZA8QHjCq7lY", authDomain: "nuru-love.firebaseapp.com", projectId: "nuru-love", storageBucket: "nuru-love.firebasestorage.app", messagingSenderId: "190648413438", appId: "1:190648413438:web:8072bfb8954a1a3f5b09af" };
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const col=collection(db,"nuru_chat");
let myName="",mediaRecorder,audioChunks=[],isRecording=false;
window.join=()=>{
  const n=document.getElementById('uname').value.trim();
  const k=document.getElementById('ukey').value.trim();
  if((n!=='Drex' && n!=='Nuru') || k!=='LOVE'){document.getElementById('denied').style.display='flex';return}
  myName=n;
  document.getElementById('login').style.display='none';
  document.getElementById('mainHeader').style.display='none';
  document.getElementById('chat').style.display='flex';
  loadMsgs();
}
function loadMsgs(){
  const q=query(col,orderBy("time"));
  onSnapshot(q,(snap)=>{
    const div=document.getElementById('msgs');div.innerHTML='';
    snap.forEach(d=>{const m=d.data();const isMe=m.name===myName;let c=m.text||"";if(m.image){c+=`<img src="${m.image}">`}if(m.voice){c+=`<audio controls src="${m.voice}"></audio>`}div.innerHTML+=`<div class="msg ${isMe?'me':'other'}"><div class="name">${m.name}</div>${c}</div>`;});
    div.scrollTop=div.scrollHeight;
  });
}
window.send=async()=>{const inp=document.getElementById('msgInput');const t=inp.value.trim();if(!t) return;await addDoc(col,{name:myName,text:t,time:serverTimestamp()});inp.value='';}
window.sendImage=(input)=>{const f=input.files[0];if(!f) return;if(f.size>800*1024){alert('Use <800KB');return}const r=new FileReader();r.onload=e=>{addDoc(col,{name:myName,text:"",image:e.target.result,time:serverTimestamp()});};r.readAsDataURL(f);input.value='';}
window.toggleVoice=async()=>{
  const btn=document.getElementById('voiceBtn');
  if(!isRecording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream);audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=async()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        if(blob.size>900*1024){alert('Keep <20sec');return}
        const reader=new FileReader();reader.onload=e=>{addDoc(col,{name:myName,text:"",voice:e.target.result,time:serverTimestamp()});};reader.readAsDataURL(blob);
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRecorder.start();isRecording=true;btn.classList.add('voice-recording');btn.innerText='⏹️';
    }catch(e){alert('Allow mic!');}
  }else{mediaRecorder.stop();isRecording=false;btn.classList.remove('voice-recording');btn.innerText='🎙️';}
}
</script>
</body>
</html>
