<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Nuru - Perfect 10 Months</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0618;color:#fff;font-family:Poppins,sans-serif;overflow:hidden;height:100vh}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0}
.login{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:radial-gradient(#2a144a,#0e0618)}
.card{width:90%;max-width:350px;background:rgba(255,255,255,.08);border:1px solid rgba(255,180,220,.25);border-radius:24px;padding:28px;text-align:center;backdrop-filter:blur(18px)}
.card h1{font-family:Great Vibes,cursive;font-size:48px;background:linear-gradient(90deg,#ff8ab4,#ff3a7a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card input{width:100%;padding:13px;margin:7px 0;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.35);color:#fff;text-align:center}
.card button{width:100%;padding:13px;margin-top:10px;border-radius:999px;border:0;background:linear-gradient(90deg,#ff7ea8,#a56bff);color:#fff;font-weight:600}
.app{display:none;flex-direction:column;height:100vh;position:relative;z-index:1}
.top{display:flex;justify-content:space-between;padding:12px;background:rgba(255,255,255,.07);border-bottom:1px solid rgba(255,180,220,.15);font-size:12px}
.timer{font-family:Great Vibes,cursive;font-size:20px;color:#ff8aba;text-align:center}
.chat{flex:1;overflow:auto;padding:15px 10px 90px;display:flex;flex-direction:column;gap:10px}
.b{max-width:76%;padding:10px 14px;border-radius:18px;font-size:14px}
.me{align-self:flex-end;background:linear-gradient(135deg,#c87bff,#ff7ea8)}
.her{align-self:flex-start;background:rgba(255,255,255,.12)}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:rgba(15,8,25,.95);border-top:1px solid rgba(255,180,220,.12)}
.bar input{flex:1;padding:12px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff}
.btn{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer}
.send{background:linear-gradient(135deg,#ff7ea8,#a56bff);color:#fff}
.music{position:fixed;top:60px;right:10px;z-index:3;background:rgba(255,100,150,.4);padding:7px 12px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,.2)}
</style></head><body>
<canvas id="hearts"></canvas>
<div id="yt-player" style="position:fixed;width:1px;height:1px;left:-10px;top:-10px;opacity:0.01;pointer-events:none;z-index:-1">
<iframe id="yt" width="1" height="1" src="https://www.youtube.com/embed/2Vv-BfVoq4g?enablejsapi=1&autoplay=1&loop=1&playlist=2Vv-BfVoq4g&controls=0&mute=0" frameborder="0" allow="autoplay; encrypted-media"></iframe>
</div>
<audio id="song" loop><source src="https://cdn.pixabay.com/audio/2022/10/30/audio_fbd6a6d90d.mp3" type="audio/mpeg"></audio>
<div class="login" id="login"><div class="card">
<h1>For Nuru ❤️</h1><p style="opacity:.6;font-size:12px;letter-spacing:1px;margin-bottom:12px">10 MONTHS TOGETHER • Perfect</p>
<input id="n" placeholder="Drex or Nuru"><input id="k" type="password" placeholder="Secret Key nuru123">
<button onclick="go()">Enter Our World 💜</button>
<p style="margin-top:10px;font-size:10px;opacity:.4">🎵 Ed Sheeran - Perfect will play</p></div></div>
<div class="app" id="app">
<div class="top"><div>💜 Drex</div><div class="timer">10 Months • <span id="days"></span> Days • Forever ❤️</div><div>💖 Nuru</div></div>
<div class="music" onclick="toggle()" id="mBtn">🎵 Play Our Song</div>
<div class="chat" id="chat"></div>
<div class="bar"><label class="btn" style="background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center">📷<input type="file" id="pic" accept="image/*" hidden></label><input id="msg" placeholder="Write to my love..."><button class="btn send" onclick="send()">➤</button></div>
</div>
<script>
c=document.getElementById('hearts');x=c.getContext('2d');function R(){c.width=innerWidth;c.height=innerHeight}R();onresize=R;
h=[];setInterval(()=>{h.push({X:Math.random()*c.width,Y:c.height+20,S:12+Math.random()*14,V:1+Math.random()*2})},200);
(function A(){x.clearRect(0,0,c.width,c.height);h.forEach((o,i)=>{o.Y-=o.V;x.font=o.S+'px serif';x.fillText('💖',o.X,o.Y);if(o.Y<-20)h.splice(i,1)});requestAnimationFrame(A)})();
start=new Date('2024-11-08');document.getElementById('days').innerText=Math.floor((new Date()-start)/86400000);
let me='';const chat=document.getElementById('chat');const KEY='nuru10';
function go(){let n=document.getElementById('n').value.trim().toLowerCase();let k=document.getElementById('k').value.trim();if((n!=='drex'&&n!=='nuru')||k!=='nuru123'){alert('Use Drex or Nuru + nuru123');return}me=n==='drex'?'Drex':'Nuru';document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';load();playSong();}
function load(){let d=JSON.parse(localStorage.getItem(KEY)||'[]');chat.innerHTML='';d.forEach(o=>add(o.t,o.w,o.i,o.m,false))}
function add(t,w,i,m,s=true){let d=document.createElement('div');d.className='b '+(w===me?'me':'her');if(t)d.innerHTML+='<div>'+t+'</div>';if(i)d.innerHTML+='<img src="'+i+'" style="max-width:100%;border-radius:10px;margin-top:5px">';d.innerHTML+='<div style="font-size:9px;opacity:.6;margin-top:4px">'+m+' • '+w+'</div>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(s){let a=JSON.parse(localStorage.getItem(KEY)||'[]');a.push({t,w,i,m});localStorage.setItem(KEY,JSON.stringify(a))}}
function send(){let inp=document.getElementById('msg');let t=inp.value.trim();if(!t)return;let tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});add(t,me,null,tm,true);inp.value='';for(let k=0;k<6;k++)h.push({X:Math.random()*c.width,Y:c.height,S:16,V:2});}
document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.getElementById('pic').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{let tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});add('',me,ev.target.result,tm,true)};r.readAsDataURL(f)});
let on=false;
function playSong(){try{document.getElementById('song').play();document.getElementById('mBtn').innerText='🎵 Perfect - Playing 💖';on=true;}catch(e){}}
function toggle(){let a=document.getElementById('song'),b=document.getElementById('mBtn');let yt=document.getElementById('yt');if(on){a.pause();b.innerText='🎵 Play Our Song';on=false}else{a.play();b.innerText='🎵 Perfect - Playing 💖';on=true;yt.src=yt.src;}}
</script></body></html>
