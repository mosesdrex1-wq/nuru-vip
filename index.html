<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Nuru - My Pink Girl</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
body{margin:0;background:linear-gradient(180deg,#fff0f5 0%,#ffe4ec 30%,#ffd1e0 100%);color:#4a2340;font-family:Poppins,sans-serif;height:100vh;overflow:hidden}
#hearts{position:fixed;inset:0;pointer-events:none;opacity:0.8}
.login{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#ffafc8 0%,#ff7ea8 40%,#d86a9a 100%)}
.card{width:90%;max-width:360px;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.8);border-radius:32px;padding:30px;text-align:center;backdrop-filter:blur(20px);box-shadow:0 25px 60px rgba(255,100,150,.3)}
.card h1{font-family:Great Vibes,cursive;font-size:52px;background:linear-gradient(90deg,#ff2d78,#ff7eb0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0}
.card p.sub{color:#8a4a6a;font-size:12px;letter-spacing:1px;margin:8px 0 18px}
.card input{width:100%;padding:14px;margin:7px 0;border-radius:999px;border:1px solid #ffd0de;background:#fff;color:#4a2340;text-align:center;outline:none}
.card button{width:100%;padding:14px;margin-top:12px;border-radius:999px;border:0;background:linear-gradient(90deg,#ff3a7a,#ff8ab4);color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 20px rgba(255,60,120,.35)}
.app{display:none;flex-direction:column;height:100vh;z-index:1;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);font-size:11px;color:#7a3a5a;border-bottom:1px solid #ffd6e4}
.timer{font-family:Great Vibes,cursive;font-size:22px;color:#ff2d78;text-align:center}
.chat{flex:1;overflow:auto;padding:16px 12px 132px;display:flex;flex-direction:column;gap:12px}
.b{max-width:74%;padding:12px 16px;border-radius:22px;font-size:14px;line-height:1.4;box-shadow:0 4px 12px rgba(255,100,130,.15);animation:pop.3s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.me{align-self:flex-end;background:linear-gradient(135deg,#ff3a7a,#ff8fb1);color:#fff;font-weight:500;border-bottom-right-radius:6px}
.her{align-self:flex-start;background:#fff;border:1px solid #ffd6e4;color:#5a2a4a;border-bottom-left-radius:6px}
.bar{position:fixed;bottom:54px;left:0;right:0;display:flex;gap:8px;padding:10px 12px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border-top:1px solid #ffd6e4}
.bar input{flex:1;padding:12px 18px;border-radius:999px;border:1px solid #ffd0de;background:#fff;color:#4a2340;outline:none}
.btn{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer}
.send{background:linear-gradient(135deg,#ff3a7a,#ff8ab4);color:#fff;box-shadow:0 4px 12px rgba(255,60,120,.3)}
.music-bar{position:fixed;bottom:0;left:0;right:0;height:54px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid #ffb3c8}
.music-bar audio{flex:1;height:34px}
.b img{border-radius:16px!important;box-shadow:0 8px 20px rgba(0,0,0,.12)}
</style></head><body>
<canvas id="hearts"></canvas>
<div class="login" id="login"><div class="card">
<h1>For Nuru 💖</h1><p class="sub">10 MONTHS • MY PINK GIRL • PERFECT</p>
<input id="n" placeholder="Drex or Nuru"><input id="k" type="password" placeholder="Secret: nuru123">
<button onclick="go()">Enter Our Pink World 🎀</button>
<p style="font-size:10px;color:#b06a85;margin-top:12px">🎵 Perfect - Ed Sheeran is playing</p>
</div></div>
<div class="app" id="app">
<div class="top"><div>💖 Drex Online</div><div class="timer">10 Months Forever 💕</div><div>🎀 Nuru Online</div></div>
<div class="chat" id="chat"></div>
<div class="bar"><label class="btn" style="background:#ffe4ec;display:flex;align-items:center;justify-content:center;font-size:18px">📷<input type="file" id="pic" accept="image/*" hidden></label><input id="msg" placeholder="Write to my pink girl..."><button class="btn send" onclick="send()">➤</button></div>
<div class="music-bar">
<span style="font-size:14px">🎀</span>
<audio id="song" controls autoplay loop src="perfect.mp3"></audio>
<span style="font-size:11px;color:#a85a7a;font-weight:600">Perfect</span>
</div>
</div>
<script>
c=document.getElementById('hearts');x=c.getContext('2d');function R(){c.width=innerWidth;c.height=innerHeight}R();onresize=R;
h=[];setInterval(()=>{h.push({X:Math.random()*c.width,Y:c.height+20,S:14+Math.random()*12,V:0.8+Math.random()*1.5,em:Math.random()>0.5?'💖':'🎀'})},180);
(function A(){x.clearRect(0,0,c.width,c.height);h.forEach((o,i)=>{o.Y-=o.V;x.font=o.S+'px serif';x.fillText(o.em,o.X,o.Y);if(o.Y<-20)h.splice(i,1)});requestAnimationFrame(A)})();
let me='';const chat=document.getElementById('chat');const KEY='nuru10';
function go(){let n=document.getElementById('n').value.toLowerCase();let k=document.getElementById('k').value;if((n!=='drex'&&n!=='nuru')||k!=='nuru123'){alert('Use Drex/Nuru + nuru123');return}me=n==='drex'?'Drex':'Nuru';document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';load();let s=document.getElementById('song');s.volume=0.85;s.play().catch(()=>{});if(me==='Nuru'){setTimeout(()=>{add("My pink girl, 10 months with you feels like Perfect by Ed Sheeran... every word is you 💖","Drex",null,new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),true)},1200)}}
function load(){let d=JSON.parse(localStorage.getItem(KEY)||'[]');chat.innerHTML='';d.forEach(o=>add(o.t,o.w,o.i,o.m,false))}
function add(t,w,i,m,s=true){let d=document.createElement('div');d.className='b '+(w===me?'me':'her');if(t)d.innerHTML+='<div>'+t+'</div>';if(i)d.innerHTML+='<img src="'+i+'" style="max-width:100%;border-radius:16px;margin-top:6px">';d.innerHTML+='<div style="font-size:9px;opacity:.55;margin-top:5px">'+m+' • '+w+'</div>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(s){let a=JSON.parse(localStorage.getItem(KEY)||'[]');a.push({t,w,i,m});localStorage.setItem(KEY,JSON.stringify(a))}}
function send(){let inp=document.getElementById('msg');let t=inp.value.trim();if(!t)return;let tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});add(t,me,null,tm,true);inp.value='';for(let k=0;k<8;k++)h.push({X:Math.random()*c.width,Y:c.height,S:18,V:1.5,em:'💖'});if(t.toLowerCase().includes('love')){for(let k=0;k<15;k++)setTimeout(()=>h.push({X:Math.random()*c.width,Y:c.height,S:20,V:2,em:'💘'}),k*80)}}
document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.getElementById('pic').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{let tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});add('',me,ev.target.result,tm,true)};r.readAsDataURL(f)});
</script></body></html>
