<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuru VIP ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#ff9a9e,#fecfef);height:100vh;display:flex;justify-content:center;align-items:center}
.box{background:white;width:95%;max-width:400px;height:90vh;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
.header{background:#ff4d6d;color:white;padding:15px;text-align:center;font-weight:bold;font-size:18px}
#login{padding:30px;display:flex;flex-direction:column;gap:15px;flex:1;justify-content:center}
#login input{padding:15px;border-radius:10px;border:1px solid #ddd;font-size:16px}
#login button{padding:15px;background:#ff4d6d;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold}
#chat{display:none;flex-direction:column;flex:1}
#msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;background:#fff5f5}
.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px;word-wrap:break-word}
.me{align-self:flex-end;background:#ff4d6d;color:white;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:white;border:1px solid #eee;border-bottom-left-radius:4px}
.name{font-size:11px;opacity:0.7;margin-bottom:3px}
.input-area{display:flex;padding:10px;border-top:1px solid #eee;gap:10px}
.input-area input{flex:1;padding:12px;border-radius:20px;border:1px solid #ddd}
.input-area button{background:#ff4d6d;color:white;border:none;width:45px;height:45px;border-radius:50%;font-size:20px}
</style>
</head>
<body>
<div class="box">
<div class="header">Nuru VIP ❤️ Private</div>
<div id="login">
<h2 style="text-align:center">Welcome ❤️</h2>
<input id="uname" placeholder="Your Name: Drex or Nuru">
<input id="ukey" type="password" placeholder="Secret Key">
<button onclick="join()">Enter Our World 💖</button>
<p style="text-align:center;font-size:12px;color:#999">Only Drex & Nuru — Key: LOVE</p>
</div>
<div id="chat">
<div id="msgs"></div>
<div class="input-area">
<input id="msgInput" placeholder="Type Hi Nuru ❤️" onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">❤️</button>
</div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCz5pO6O-ytj3PaNYAC36TCZA8QHjCq7lY",
  authDomain: "nuru-love.firebaseapp.com",
  projectId: "nuru-love",
  storageBucket: "nuru-love.firebasestorage.app",
  messagingSenderId: "190648413438",
  appId: "1:190648413438:web:8072bfb8954a1a3f5b09af"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const col = collection(db, "nuru_chat");
let myName = "";
window.join = () => {
  const n = document.getElementById('uname').value.trim();
  const k = document.getElementById('ukey').value.trim();
  if((n !== 'Drex' && n !== 'Nuru')){alert('Name must be Drex or Nuru');return}
  if(k !== 'LOVE'){alert('Wrong Secret Key! Key is LOVE');return}
  myName = n;
  document.getElementById('login').style.display='none';
  document.getElementById('chat').style.display='flex';
  loadMsgs();
}
function loadMsgs(){
  const q = query(col, orderBy("time"));
  onSnapshot(q, (snap)=>{
    const div = document.getElementById('msgs');
    div.innerHTML='';
    snap.forEach(d=>{
      const m = d.data();
      const isMe = m.name === myName;
      div.innerHTML+=`<div class="msg ${isMe?'me':'other'}"><div class="name">${m.name}</div>${m.text}</div>`;
    });
    div.scrollTop = div.scrollHeight;
  });
}
window.send = async () => {
  const inp = document.getElementById('msgInput');
  const t = inp.value.trim();
  if(!t) return;
  await addDoc(col, {name: myName, text: t, time: serverTimestamp()});
  inp.value='';
}
</script>
</body>
</html>
