<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NURU VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial}
body{background:#000;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
body::before{content:'';position:fixed;width:400px;height:400px;background:rgba(255,20,80,0.15);filter:blur(90px);border-radius:50%;top:10%;left:10%;pointer-events:none}
body::after{content:'';position:fixed;width:350px;height:350px;background:rgba(255,105,180,0.12);filter:blur(80px);border-radius:50%;bottom:10%;right:10%;pointer-events:none}
.box{width:96%;max-width:410px;height:94vh;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;border:1px solid rgba(255,0,60,0.4);box-shadow:0 0 40px rgba(255,0,60,0.25),0 0 80px rgba(255,105,180,0.15);background:rgba(10,10,10,0.9);backdrop-filter:blur(20px);position:relative;z-index:2}

/* HEADER - STYLISH */
.header{background:linear-gradient(180deg,#0a0a0a,#000);padding:14px 14px 10px;text-align:center;border-bottom:1px solid rgba(255,0,60,0.25)}
.header.title{color:#ffd700;font-size:15px;letter-spacing:3px;font-weight:900;text-shadow:0 0 10px rgba(255,215,0,0.5)}
.header.romantic-line{font-family:'Great Vibes',cursive;color:#ff6b9d;font-size:20px;margin-top:6px;text-shadow:0 0 12px rgba(255,105,180,0.6);letter-spacing:1px}

/* HELL LOCK - Minimal */
#login{padding:22px;display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center;background:radial-gradient(circle at center,#15000a,#000);text-align:center}
.lock-icon{font-size:64px;filter:drop-shadow(0 0 20px red);animation:shake 0.5s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
#login h2{color:#ff003c;font-size:30px;letter-spacing:3px;text-shadow:0 0 15px red}
#login input{padding:14px;border-radius:12px;border:1px solid rgba(255,0,60,0.3);background:rgba(20,0,10,0.8);color:white;outline:none;font-size:15px}
#login button{padding:14px;background:linear-gradient(90deg,#ff003c,#ff5a8a);color:white;border:none;border-radius:12px;font-weight:900;letter-spacing:1px;box-shadow:0 0 20px rgba(255,0,60,0.5)}
.hell-warn{border:1px solid rgba(255,0,0,0.3);background:rgba(255,0,0,0.07);border-radius:10px;padding:10px;color:#ff4d4d;font-size:10px;line-height:1.5;font-weight:bold}

/* HEAVEN INSIDE - Black Red Blurred Pink */
#chat{display:none;flex-direction:column;flex:1;background:rgba(5,5,5,0.95)}
#msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:11px;background:transparent}
.msg{max-width:78%;padding:11px 14px;border-radius:18px;font-size:14.5px;word-wrap:break-word;backdrop-filter:blur(10px)}
.me{align-self:flex-end;background:linear-gradient(135deg,#ff003c,#ff7aa2);color:white;border-bottom-right-radius:4px;box-shadow:0 0 15px rgba(255,0,60,0.3)}
.other{align-self:flex-start;background:rgba(30,30,30,0.9);color:#ffb3c6;border:1px solid rgba(255,105,180,0.2);border-bottom-left-radius:4px}
.name{font-size:9px;opacity:0.6;margin-bottom:3px;color:#ff7aa2}
.msg img{max-width:100%;border-radius:12px;margin-top:6px;display:block;border:1px solid rgba(255,105,180,0.2)}
.input-area{display:flex;padding:10px;background:rgba(15,0,10,0.9);border-top:1px solid rgba(255,0,60,0.2);gap:8px;align-items:center;backdrop-filter:blur(15px)}
.input-area input[type=text]{flex:1;padding:12px 16px;border-radius:25px;border:1px solid rgba(255,105,180,0.2);background:rgba(30,10,20,0.8);color:white;outline:none}
.icon-btn{background:rgba(40,0,20,0.8);border:1px solid rgba(255,0,60,0.25);width:42px;height:42px;border-radius:50%;color:#ff6b9d;display:flex;align-items:center;justify-content:center;cursor:pointer}
.send-btn{background:linear-gradient(135deg,#ff003c,#ff7aa2);border:none;width:46px;height:46px;border-radius:50%;color:white;font-size:18px;box-shadow:0 0 12px rgba(255,0,60,0.4)}
#denied{position:fixed;top:0;left:0;width:100%;height:100%;background:black;display:none;justify-content:center;align-items:center;z-index:999;flex-direction:column;gap:15px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="box">
<div class="header">
<div class="title">NURU VIP ❤️ PRIVATE</div>
<div class="romantic-line" id="stylishRom">Drex was born to love Nuru — nothing else 💛🔐</div>
</div>

<div id="login">
<div class="lock-icon">🔒</div>
<h2>LOCKED</h2>
<input id="uname" placeholder="Name">
<input id="ukey" type="password" placeholder="Key">
<button onclick="join()">UNLOCK 🔓</button>
<div class="hell-warn">☠️ PRIVATE CURSED ZONE — Trespassers fall into a pit with no return. LEAVE. 💀</div>
</div>

<div id="chat">
<div id="msgs"></div>
<div class="input-area">
<label class="icon-btn">📷<input id="imgInput" type="file" accept="image/*" hidden onchange="sendImage(this)"></label>
<input id="msgInput" type="text" placeholder="Tell Nuru you love her ❤️" onkeypress="if(event.key==='Enter')send()">
<button class="send-btn" onclick="send()">❤️</button>
</div>
</div>
</div>

<div id="denied">
<h1 style="color:red;font-size:48px">🚫 ACCESS DENIED</h1>
<p style="color:red;font-weight:bold">YOU ARE NOT DREX OR NURU<br><br>IP TRACKED. CURSE ACTIVATED. ☠️</p>
<button onclick="document.getElementById('denied').style.display='none'" style="padding:12px 25px;border-radius:20px;border:1px solid red;background:black;color:red">RUN</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCz5pO6O-ytj3PaNYAC36TCZA8QHjCq7lY",
  authDomain: "nuru-love.firebaseapp.com",
  projectId: "nuru-love",
  storageBucket: "nuru-love.firebasestorage.app",
  messagingSenderId: "190648413438",
  appId: "1:190648413438:web:8072bfb8954a1a3f5b09af"
};

const stylishLines = [
  "Drex was born to love Nuru — nothing else 💛🔐",
  "My heart beats in Nuru's rhythm 💓",
  "Nuru, you are my forever prayer 🤲💖",
  "In a world of many, you are my only 🌙❤️",
  "Nuru, my soul whispers your name ✨"
];
let sIdx=0;
setInterval(()=>{
  const el=document.getElementById('stylishRom');
  el.style.opacity=0;
  setTimeout(()=>{el.innerText=stylishLines[sIdx];el.style.opacity=1;sIdx=(sIdx+1)%stylishLines.length},400);
},4000);

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const col=collection(db,"nuru_chat");
let myName="";
window.join=()=>{
  const n=document.getElementById('uname').value.trim();
  const k=document.getElementById('ukey').value.trim();
  if((n!=='Drex' && n!=='Nuru') || k!=='LOVE'){document.getElementById('denied').style.display='flex';return}
  myName=n;
  document.getElementById('login').style.display='none';
  document.getElementById('chat').style.display='flex';
  loadMsgs();
}
function loadMsgs(){
  const q=query(col,orderBy("time"));
  onSnapshot(q,(snap)=>{
    const div=document.getElementById('msgs');
    div.innerHTML='';
    snap.forEach(d=>{
      const m=d.data();
      const isMe=m.name===myName;
      let content=m.text||"";
      if(m.image){content+=`<img src="${m.image}" onclick="window.open(this.src)">`}
      div.innerHTML+=`<div class="msg ${isMe?'me':'other'}"><div class="name">${m.name}</div>${content}</div>`;
    });
    div.scrollTop=div.scrollHeight;
  });
}
window.send=async()=>{
  const inp=document.getElementById('msgInput');
  const t=inp.value.trim();
  if(!t) return;
  await addDoc(col,{name:myName,text:t,time:serverTimestamp()});
  inp.value='';
}
window.sendImage=(input)=>{
  const file=input.files[0];
  if(!file) return;
  if(file.size>800*1024){alert('Use <800KB');return}
  const reader=new FileReader();
  reader.onload=e=>{addDoc(col,{name:myName,text:"",image:e.target.result,time:serverTimestamp()});};
  reader.readAsDataURL(file);
  input.value='';
}
</script>
</body>
</html>
